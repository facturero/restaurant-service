openapi: 3.0.3

info:
  title: restaurant-service API
  version: 1.0.0
  description: >
    Plugin de restaurantes. Entregable 1: mapa del local (plantas, zonas, mesas con
    posición y forma opcionales, un plano guardado como JSON versionado y los horarios
    de atención con turnos y excepciones). Entregable 2: reservas del cliente final
    (página pública, varias mesas por reserva, correos, enlace de cancelación) y su
    gestión por el personal.


    Las rutas se sirven CON el prefijo `/restaurant` (el gateway reenvía
    `ANY /restaurant/*` sin quitarlo). `/health` va sin prefijo ni autenticación.


    No verifica JWT: confía en las cabeceras del gateway (X-Organization-Id,
    X-User-Id, X-Country-Code, X-Permissions). Todo recurso de otra organización
    responde 404, nunca 403: no se filtra la existencia.


    MÓDULOS DE PAGO: el gateway exige `restaurant.floorplan` para el mapa y
    `restaurant.reservations` para las rutas de reservas del personal
    (`requiresPlugin`); sin el módulo la respuesta es `403 PLUGIN_NOT_ACTIVE` y no
    llega a este servicio.


    RUTAS PÚBLICAS (`/public/…`): sin sesión ni cabeceras de contexto. El gateway las
    deja pasar con límite de peticiones por IP; la organización la resuelve este
    servicio a partir del enlace del restaurante o del token de la reserva, y ES ÉL
    quien comprueba que `restaurant.reservations` esté contratado. Cualquier razón
    para que un restaurante no esté abierto al público (no existe, apagado, sin el
    módulo) responde igual, `404 RESTAURANT_NOT_FOUND`.


    MESAS NUNCA SE BORRAN: desactivar libera el nombre (y el índice único cubre
    solo mesas activas) pero conserva la fila y su id, porque el entregable 2 ata
    las reservas a esos ids. Tampoco hay DELETE de plantas ni de zonas.


    Fuera de alcance por ahora: garantía con tarjeta, varias plantas en la interfaz
    y el aviso en la campana del CRM. El servicio NO consume eventos.

servers:
  - url: http://localhost:3015
    description: Desarrollo local
  - url: http://restaurant-service-node:3015
    description: Dentro del clúster

tags:
  - name: health
  - name: establishments
  - name: floors
  - name: tables
  - name: zones
  - name: schedule
  - name: reservation-settings
  - name: reservations
  - name: public

paths:

  /health:
    get:
      tags: [health]
      summary: Healthcheck (sin autenticación)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # -------------------------------------------------------------------------
  # Inicialización
  # -------------------------------------------------------------------------
  /restaurant/establishments/{establishmentId}/setup:
    post:
      tags: [establishments]
      summary: Inicializar el establecimiento (idempotente)
      description: >
        Deja una planta «Salón principal» y un horario por defecto la primera vez.
        Llamarlo de nuevo no duplica nada: devuelve lo existente. Se llama al abrir
        las pantallas del plugin.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Planta y horario del establecimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupResult' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EstablishmentNotFound' }

  # -------------------------------------------------------------------------
  # Plantas
  # -------------------------------------------------------------------------
  /restaurant/establishments/{establishmentId}/floors:
    get:
      tags: [floors]
      summary: Listar las plantas del establecimiento
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Plantas ordenadas por `sortOrder`
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Floor' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurant/floors/{floorId}/plan:
    get:
      tags: [floors]
      summary: Abrir el plano completo (planta + zonas + mesas + dibujo)
      description: >
        Todo lo que el editor necesita para pintar el local, en una sola petición.
        El borrador se guarda en el navegador (localStorage); el servidor solo
        conoce la última versión publicada.
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      responses:
        '200':
          description: El plano
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloorPlan' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FloorNotFound' }

    put:
      tags: [floors]
      summary: Guardar el plano completo
      description: >
        Aplica en UNA sola transacción: o queda todo o no queda nada. Las mesas y
        zonas que ya no vienen se desactivan (jamás se borran). El control de
        versión va antes de escribir: si `expectedVersion` no es la actual, otra
        persona guardó y se responde 409 con `currentVersion`.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveFloorPlanRequest' }
      responses:
        '200':
          description: Planta guardada (con la nueva `layoutVersion`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Floor' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FloorNotFound' }
        '409':
          description: Otra persona guardó antes (`PLAN_VERSION_CONFLICT`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: PLAN_VERSION_CONFLICT
                message: Otra persona modificó el plano.
                details:
                  - { field: expectedVersion, message: 'La versión del plano ha cambiado (ahora es la 3).' }
                  - { field: currentVersion, message: '3' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /restaurant/floors/{floorId}:
    patch:
      tags: [floors]
      summary: Actualizar una planta (nombre, medidas, orden o estado)
      description: >
        Renombrar a un nombre ya usado en el establecimiento responde 409, aunque
        sea con otro idioma de colación: el índice es único por establecimiento.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFloorRequest' }
      responses:
        '200':
          description: Planta actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Floor' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FloorNotFound' }
        '409':
          description: Ya existe una planta con ese nombre (`FLOOR_NAME_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: FLOOR_NAME_EXISTS, message: Ya existe una planta con ese nombre en el establecimiento. }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------------------------------------------------------
  # Mesas
  # -------------------------------------------------------------------------
  /restaurant/establishments/{establishmentId}/tables:
    get:
      tags: [tables]
      summary: Listar mesas del establecimiento, con filtros
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
        - name: floorId
          in: query
          schema: { type: string, format: uuid }
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: Mesas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /restaurant/floors/{floorId}/tables:
    post:
      tags: [tables]
      summary: Crear una mesa
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTableRequest' }
      responses:
        '201':
          description: Mesa creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Planta o zona inexistente (la zona debe ser de la misma planta)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: ZONE_NOT_FOUND, message: Zona no encontrada. }
        '409':
          description: Ya existe una mesa activa con ese nombre en la planta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: TABLE_NAME_EXISTS, message: Ya existe una mesa activa con ese nombre en la planta. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /restaurant/floors/{floorId}/tables/bulk:
    post:
      tags: [tables]
      summary: «¿Cuántas mesas tienes?» — crear N de golpe
      description: >
        Nombra las nuevas `Mesa 1…N` continuando desde la última existente, para que
        añadir mesas a un local que ya tenía no repita nombres ni reinicie la
        numeración. La ruta fija se declara antes que la de parámetro.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCreateTablesRequest' }
      responses:
        '201':
          description: Mesas creadas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FloorNotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /restaurant/tables/{id}:
    patch:
      tags: [tables]
      summary: Actualizar una mesa (también desactivarla)
      description: >
        `status: inactive` desactiva la mesa y libera su nombre. No existe DELETE:
        la fila y su id se conservan para las reservas del entregable 2.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTableRequest' }
      responses:
        '200':
          description: Mesa actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Table' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TableNotFound' }
        '409':
          description: Nombre ya usado por otra mesa activa (`TABLE_NAME_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------------------------------------------------------
  # Zonas
  # -------------------------------------------------------------------------
  /restaurant/floors/{floorId}/zones:
    get:
      tags: [zones]
      summary: Listar las zonas de una planta
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      responses:
        '200':
          description: Zonas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      tags: [zones]
      summary: Crear una zona
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/FloorId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateZoneRequest' }
      responses:
        '201':
          description: Zona creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/FloorNotFound' }
        '409':
          description: Ya existe una zona con ese nombre en la planta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: ZONE_NAME_EXISTS, message: Ya existe una zona con ese nombre en la planta. }
        '422': { $ref: '#/components/responses/ValidationError' }

  /restaurant/zones/{id}:
    patch:
      tags: [zones]
      summary: Actualizar una zona
      description: >
        El índice de zonas es único por planta SIN condición de estado, así que una
        zona desactivada conserva su nombre: renombrar es actualizar la misma fila.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateZoneRequest' }
      responses:
        '200':
          description: Zona actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ZoneNotFound' }
        '409':
          description: Nombre de zona ya usado (`ZONE_NAME_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # -------------------------------------------------------------------------
  # Horarios
  # -------------------------------------------------------------------------
  /restaurant/establishments/{establishmentId}/schedule:
    get:
      tags: [schedule]
      summary: Leer los ajustes, turnos y excepciones del horario
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Horario del establecimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleView' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: El establecimiento aún no está inicializado (`SCHEDULE_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: SCHEDULE_NOT_FOUND, message: Horario no encontrado. Inicializa el establecimiento primero. }

    put:
      tags: [schedule]
      summary: Guardar ajustes y reemplazar todos los turnos
      description: >
        Reemplaza ajustes y turnos de una vez: un horario a medias (turnos nuevos
        con ajustes viejos) sería peor que no guardar. Valida ambos juntos y
        devuelve todos los problemas.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveScheduleRequest' }
      responses:
        '200':
          description: Horario guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule: { $ref: '#/components/schemas/EstablishmentSchedule' }
                  shifts:
                    type: array
                    items: { $ref: '#/components/schemas/Shift' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Horario no inicializado (`SCHEDULE_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Horario inválido (`INVALID_SCHEDULE` o `VALIDATION_ERROR`) con todos los problemas juntos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/establishments/{establishmentId}/schedule/preview:
    get:
      tags: [schedule]
      summary: Vista previa de turnos que vería un cliente una fecha
      description: >
        Prueba de que el horario quedó bien configurado. Es la base del entregable 2.
        Regla del producto: el último turno empieza como muy tarde `slotMinutes`
        antes del cierre (12:00-15:00 con huecos de 30 ⇒ 12:00 … 14:30).
      x-required-permission: restaurant:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          description: Fecha LOCAL del establecimiento (YYYY-MM-DD).
      responses:
        '200':
          description: Inicios de turno de esa fecha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotsPreview' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Horario no inicializado (`SCHEDULE_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Falta el parámetro `date` o no tiene formato YYYY-MM-DD
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/establishments/{establishmentId}/schedule/exceptions:
    post:
      tags: [schedule]
      summary: Añadir una excepción (cierre o horario especial) a una fecha
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddScheduleExceptionRequest' }
      responses:
        '201':
          description: Excepción creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleException' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Horario no inicializado (`SCHEDULE_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya hay una excepción para esa fecha (`SCHEDULE_EXCEPTION_EXISTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /restaurant/schedule/exceptions/{id}:
    delete:
      tags: [schedule]
      summary: Borrar una excepción
      description: >
        La ruta no lleva el establecimiento en el path, así que el servicio resuelve
        el horario por la excepción para publicar el evento con `establishmentId`.
      x-required-permission: restaurant:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Borrada (sin cuerpo)
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Excepción inexistente o de otra organización (`SCHEDULE_EXCEPTION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: SCHEDULE_EXCEPTION_NOT_FOUND, message: Excepción de horario no encontrada. }
  # ── Reservas: personal (restaurant.reservations; permisos reservation:*) ───

  /restaurant/establishments/{establishmentId}/reservation-settings:
    get:
      tags: [reservation-settings]
      summary: Ajustes de reservas del local
      description: Si el local nunca los configuró devuelve los valores por defecto (apagado, sin enlace), sin guardarlos.
      x-required-permission: reservation:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      responses:
        '200':
          description: Ajustes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationSettings' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [reservation-settings]
      summary: Guardar ajustes de reservas (parcial)
      description: >
        Solo cambia los campos que vengan. No se puede encender (`enabled: true`) sin `publicSlug` ni `displayName`.
        El enlace (`publicSlug`) es único en todo el sistema: repetido responde `409 SLUG_TAKEN`.
      x-required-permission: reservation:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationSettingsInput' }
      responses:
        '200':
          description: Ajustes guardados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationSettings' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Establecimiento inexistente (`ESTABLISHMENT_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: El enlace ya lo usa otro restaurante (`SLUG_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Datos inválidos (`VALIDATION_ERROR`; `details` por campo)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/establishments/{establishmentId}/availability:
    get:
      tags: [reservations]
      summary: Horas disponibles de un día (vista del personal)
      description: >
        Igual que la página pública pero SIN el tope de días de anticipación ni la antelación mínima, y sin tope de
        personas: el personal puede anotar una reserva de última hora. Una hora que ya pasó no se ofrece nunca.
      x-required-permission: reservation:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/PartySize'
      responses:
        '200':
          description: Disponibilidad del día
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayAvailability' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Local sin horario (`SCHEDULE_NOT_FOUND`); inicialícelo con `setup`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Parámetros inválidos (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/establishments/{establishmentId}/reservations:
    get:
      tags: [reservations]
      summary: Lista de reservas de un día (o de los siguientes `days`)
      description: Ordenadas por hora de inicio. `date` es el día LOCAL del restaurante.
      x-required-permission: reservation:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: days, in: query, required: false, description: 'Cuántos días mostrar desde `date` (1 a 31, por defecto 1).', schema: { type: integer, minimum: 1, maximum: 31 } }
        - { name: status, in: query, required: false, description: 'Estados separados por coma, p. ej. `confirmed,seated`.', schema: { type: string } }
      responses:
        '200':
          description: Reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Parámetros inválidos (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [reservations]
      summary: Anotar una reserva (por teléfono o en persona)
      description: >
        No exige que la página pública esté encendida. El correo es opcional: sin él no hay aviso al cliente. Puede
        indicar `tableIds` para sentar al grupo en mesas concretas; si no, el sistema elige (la más ajustada; si no
        alcanza, varias mesas sueltas hasta el máximo del dueño, preferiblemente de una misma zona y cercanas).
        Todo ocurre bajo bloqueo de las mesas: dos peticiones simultáneas no pueden quedarse con la misma.
      x-required-permission: reservation:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/EstablishmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffReservationInput' }
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Local sin horario (`SCHEDULE_NOT_FOUND`) o mesa elegida inexistente (`TABLE_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Sin mesa libre a esa hora (`SLOT_TAKEN`) o mesas elegidas ocupadas (`TABLES_UNAVAILABLE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Hora no ofrecida (`SLOT_NOT_OFFERED`), grupo que no cabe (`PARTY_SIZE_NOT_ALLOWED`) o datos inválidos (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/reservations/{id}:
    get:
      tags: [reservations]
      summary: Detalle de una reserva
      x-required-permission: reservation:read
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Inexistente o de otra organización (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/reservations/{id}/status:
    patch:
      tags: [reservations]
      summary: Sentar, terminar o marcar «no se presentó»
      description: >
        Transiciones válidas: `confirmed → seated | no_show`, `seated → completed`, `pending → confirmed`. Terminar o
        marcar «no se presentó» libera las mesas. Para cancelar use `POST …/cancel`.
      x-required-permission: reservation:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReservationStatus' }
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Inexistente o de otra organización (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Transición no permitida (`INVALID_RESERVATION_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Estado no válido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurant/reservations/{id}/cancel:
    post:
      tags: [reservations]
      summary: Cancelar una reserva (personal)
      description: Libera las mesas y publica `restaurant.reservation.cancelled` (el cliente recibe un correo si dejó el suyo).
      x-required-permission: reservation:manage
      parameters:
        - $ref: '#/components/parameters/OrgHeader'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300, nullable: true }
      responses:
        '200':
          description: Reserva cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/OrgContextRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Inexistente o de otra organización (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya estaba cancelada o terminada (`INVALID_RESERVATION_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Reservas: cliente final (SIN sesión; límite de peticiones por IP en el gateway) ──

  /public/restaurants/{slug}:
    get:
      tags: [public]
      summary: Ficha pública del restaurante
      description: Nombre, nota, teléfono, zona horaria, límites y días de la semana con servicio. Nada interno.
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Ficha
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicRestaurant' }
        '404':
          description: No existe, está apagado o no tiene el módulo (`RESTAURANT_NOT_FOUND`; siempre igual)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /public/restaurants/{slug}/availability:
    get:
      tags: [public]
      summary: Horas disponibles de un día para un grupo
      description: >
        Aplica el tope de días de anticipación y la antelación mínima del dueño. `status` del día: `open`, `closed`
        (sin turnos o con cierre), `past` o `too_far`. Cada hora trae `available` y, si no, `reason` (`full` o `notice`).
        Un grupo mayor al máximo del dueño, o que no cabe ni con todas las mesas permitidas, recibe `422` con el
        teléfono del restaurante si lo dejó.
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/PartySize'
      responses:
        '200':
          description: "Disponibilidad del día (`Cache-Control: no-store`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayAvailability' }
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Parámetros inválidos o grupo fuera de rango (`PARTY_SIZE_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /public/restaurants/{slug}/reservations:
    post:
      tags: [public]
      summary: Reservar
      description: >
        Nace confirmada (no hay garantía con tarjeta todavía). Devuelve un `token`: es el secreto del enlace de la
        reserva (`<sitio>/r/<token>`); en la base solo se guarda su hash. Máximo 3 reservas vigentes por correo o
        teléfono en un mismo local (`429 TOO_MANY_RESERVATIONS`). `website` es un campo trampa para robots: debe ir vacío.
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicReservationInput' }
      responses:
        '201':
          description: Reserva creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: 'Secreto del enlace; 43 caracteres base64url.' }
                  reservation: { $ref: '#/components/schemas/PublicReservation' }
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Justo se ocupó esa hora (`SLOT_TAKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Hora no ofrecida (`SLOT_NOT_OFFERED`), grupo fuera de rango (`PARTY_SIZE_NOT_ALLOWED`) o datos inválidos (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Demasiadas reservas vigentes (`TOO_MANY_RESERVATIONS`) o límite de peticiones del gateway (`RATE_LIMIT_EXCEEDED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /public/reservations/{token}:
    get:
      tags: [public]
      summary: Ver una reserva con su enlace
      description: No devuelve correo, teléfono ni notas, porque el enlace puede reenviarse.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReservation' }
        '404':
          description: Token desconocido (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /public/reservations/{token}/cancel:
    post:
      tags: [public]
      summary: Cancelar una reserva con su enlace
      description: Solo mientras esté vigente y antes de la hora. Libera las mesas, avisa al restaurante y confirma al cliente por correo.
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Reserva cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReservation' }
        '404':
          description: Token desconocido (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya cancelada, terminada o pasada la hora (`INVALID_RESERVATION_TRANSITION`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:

  parameters:
    OrgHeader:
      name: X-Organization-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    EstablishmentId:
      name: establishmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FloorId:
      name: floorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Date:
      name: date
      in: query
      required: true
      description: Día local del restaurante.
      schema: { type: string, format: date }
    PartySize:
      name: partySize
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: path
      required: true
      description: Enlace público del restaurante (`reservation-settings.publicSlug`).
      schema: { type: string }
    Token:
      name: token
      in: path
      required: true
      description: Secreto del enlace de la reserva.
      schema: { type: string }

  schemas:

    EntityStatus:
      type: string
      enum: [active, inactive]

    TableShape:
      type: string
      enum: [rect, round]

    Rotation:
      type: integer
      enum: [0, 90, 180, 270]

    ZoneColor:
      type: string
      description: Token del tema, nunca hexadecimal. El front pinta `rgb(var(--v-theme-<token>))`.
      enum: [primary, secondary, success, info, warning, error]

    ObjectKind:
      type: string
      enum: [bar, column, restroom, kitchen, plant, stairs, entrance]

    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Floor:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        name: { type: string, example: Salón principal, maxLength: 80 }
        widthCm:
          type: integer
          nullable: true
          minimum: 300
          maximum: 100000
          description: Ancho del local en centímetros (3 m … 1000 m).
        heightCm: { type: integer, nullable: true, minimum: 300, maximum: 100000 }
        sortOrder: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/EntityStatus' }
        layoutVersion:
          type: integer
          minimum: 0
          description: Sube de uno en uno con cada guardado del plano (bloqueo optimista).
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Zone:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        name: { type: string, maxLength: 60 }
        color: { $ref: '#/components/schemas/ZoneColor' }
        status: { $ref: '#/components/schemas/EntityStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Table:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid, nullable: true }
        name: { type: string, maxLength: 60, description: Único entre las mesas ACTIVAS de la planta. }
        capacityMin: { type: integer, minimum: 1, maximum: 50 }
        capacityMax: { type: integer, minimum: 1, maximum: 50 }
        xCm: { type: integer, nullable: true, description: Posición en el plano; `null` = sin ubicar. }
        yCm: { type: integer, nullable: true }
        widthCm: { type: integer, minimum: 30, maximum: 600 }
        heightCm: { type: integer, minimum: 30, maximum: 600, description: En mesas redondas es igual a `widthCm` (diámetro). }
        shape: { $ref: '#/components/schemas/TableShape' }
        rotationDeg: { $ref: '#/components/schemas/Rotation' }
        status: { $ref: '#/components/schemas/EntityStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlanElement:
      description: >
        Pared, puerta u objeto decorativo. Discriminado por `type`. Coordenadas en
        centímetros enteros (0 … 100000). Se guarda en `floors.layout_elements`.
      oneOf:
        - type: object
          required: [id, type, x1, y1, x2, y2]
          properties:
            id: { type: string }
            type: { type: string, enum: [wall] }
            x1: { type: integer }
            y1: { type: integer }
            x2: { type: integer }
            y2: { type: integer }
            thicknessCm: { type: integer, default: 10, minimum: 1, maximum: 100 }
        - type: object
          required: [id, type, x, y, widthCm, rotationDeg]
          properties:
            id: { type: string }
            type: { type: string, enum: [door] }
            x: { type: integer }
            y: { type: integer }
            widthCm: { type: integer, minimum: 20, maximum: 2000 }
            rotationDeg: { $ref: '#/components/schemas/Rotation' }
        - type: object
          required: [id, type, kind, x, y, widthCm, heightCm, rotationDeg]
          properties:
            id: { type: string }
            type: { type: string, enum: [object] }
            kind: { $ref: '#/components/schemas/ObjectKind' }
            x: { type: integer }
            y: { type: integer }
            widthCm: { type: integer, minimum: 10 }
            heightCm: { type: integer, minimum: 10 }
            rotationDeg: { $ref: '#/components/schemas/Rotation' }
            label: { type: string, maxLength: 60 }

    FloorPlan:
      type: object
      properties:
        floor: { $ref: '#/components/schemas/Floor' }
        zones:
          type: array
          items: { $ref: '#/components/schemas/Zone' }
        tables:
          type: array
          items: { $ref: '#/components/schemas/Table' }
        layout:
          type: object
          properties:
            version: { type: integer, minimum: 0 }
            elements:
              type: array
              items: { $ref: '#/components/schemas/PlanElement' }

    EstablishmentSchedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        timezone: { type: string, example: America/Guayaquil }
        slotMinutes:
          type: integer
          enum: [5, 10, 15, 20, 30, 60]
          description: Cada cuántos minutos se ofrece un turno.
        cleanupMinutes: { type: integer, minimum: 0, maximum: 120 }
        durationByPartySize:
          type: array
          description: >
            Duración de una comida por tamaño de grupo. La última fila tiene
            `upTo: null` («y todos los mayores»).
          items:
            type: object
            required: [upTo, minutes]
            properties:
              upTo: { type: integer, nullable: true, minimum: 1 }
              minutes: { type: integer, minimum: 15, maximum: 480 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Shift:
      type: object
      properties:
        id: { type: string, format: uuid }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 = domingo … 6 = sábado. }
        opensAt: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$', example: '12:00' }
        closesAt: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$', example: '15:00' }
        label: { type: string, nullable: true, example: Almuerzo }

    ScheduleException:
      type: object
      properties:
        id: { type: string, format: uuid }
        onDate: { type: string, format: date, example: '2026-12-25' }
        kind: { type: string, enum: [closed, special_hours] }
        opensAt: { type: string, nullable: true, description: Solo en `special_hours`. }
        closesAt: { type: string, nullable: true }
        reason: { type: string, nullable: true, maxLength: 120 }
        createdAt: { type: string, format: date-time }

    ScheduleView:
      type: object
      properties:
        schedule: { $ref: '#/components/schemas/EstablishmentSchedule' }
        shifts:
          type: array
          items: { $ref: '#/components/schemas/Shift' }
        exceptions:
          type: array
          items: { $ref: '#/components/schemas/ScheduleException' }

    SlotsPreview:
      type: object
      properties:
        date: { type: string, format: date }
        timezone: { type: string }
        slots:
          type: array
          items:
            type: object
            properties:
              startsAt: { type: string, example: '12:30' }
              shiftLabel: { type: string, nullable: true }

    SetupResult:
      type: object
      properties:
        floor: { $ref: '#/components/schemas/Floor' }
        schedule: { $ref: '#/components/schemas/EstablishmentSchedule' }

    UpdateFloorRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        widthCm: { type: integer, nullable: true, minimum: 300, maximum: 100000 }
        heightCm: { type: integer, nullable: true, minimum: 300, maximum: 100000 }
        sortOrder: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/EntityStatus' }

    CreateZoneRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: '#/components/schemas/ZoneColor' }

    UpdateZoneRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: '#/components/schemas/ZoneColor' }
        status: { $ref: '#/components/schemas/EntityStatus' }

    CreateTableRequest:
      type: object
      additionalProperties: false
      required: [name, capacityMin, capacityMax]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        capacityMin: { type: integer, minimum: 1, maximum: 50 }
        capacityMax: { type: integer, minimum: 1, maximum: 50 }
        zoneId: { type: string, format: uuid, nullable: true }
        xCm: { type: integer, nullable: true }
        yCm: { type: integer, nullable: true }
        widthCm: { type: integer, minimum: 30, maximum: 600 }
        heightCm: { type: integer, minimum: 30, maximum: 600 }
        shape: { $ref: '#/components/schemas/TableShape' }
        rotationDeg: { $ref: '#/components/schemas/Rotation' }

    UpdateTableRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        capacityMin: { type: integer, minimum: 1, maximum: 50 }
        capacityMax: { type: integer, minimum: 1, maximum: 50 }
        zoneId: { type: string, format: uuid, nullable: true }
        xCm: { type: integer, nullable: true }
        yCm: { type: integer, nullable: true }
        widthCm: { type: integer, minimum: 30, maximum: 600 }
        heightCm: { type: integer, minimum: 30, maximum: 600 }
        shape: { $ref: '#/components/schemas/TableShape' }
        rotationDeg: { $ref: '#/components/schemas/Rotation' }
        status: { $ref: '#/components/schemas/EntityStatus' }

    BulkCreateTablesRequest:
      type: object
      additionalProperties: false
      required: [count, capacityMin, capacityMax]
      properties:
        count: { type: integer, minimum: 1, maximum: 100 }
        capacityMin: { type: integer, minimum: 1, maximum: 50 }
        capacityMax: { type: integer, minimum: 1, maximum: 50 }
        prefix: { type: string, minLength: 1, maxLength: 30, default: Mesa }

    PlanZonePayload:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        color: { $ref: '#/components/schemas/ZoneColor' }

    PlanTablePayload:
      type: object
      additionalProperties: false
      required: [id, name, capacityMin, capacityMax]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 60 }
        capacityMin: { type: integer, minimum: 1, maximum: 50 }
        capacityMax: { type: integer, minimum: 1, maximum: 50 }
        zoneId: { type: string, format: uuid, nullable: true }
        xCm: { type: integer, nullable: true }
        yCm: { type: integer, nullable: true }
        widthCm: { type: integer, minimum: 30, maximum: 600 }
        heightCm: { type: integer, minimum: 30, maximum: 600 }
        shape: { $ref: '#/components/schemas/TableShape' }
        rotationDeg: { $ref: '#/components/schemas/Rotation' }

    SaveFloorPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, floor, zones, tables, elements]
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: La `layoutVersion` que el editor tenía al abrir; si no coincide, 409.
        floor:
          type: object
          additionalProperties: false
          properties:
            widthCm: { type: integer, nullable: true, minimum: 300, maximum: 100000 }
            heightCm: { type: integer, nullable: true, minimum: 300, maximum: 100000 }
        zones:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/PlanZonePayload' }
        tables:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanTablePayload' }
        elements:
          type: array
          maxItems: 500
          description: Máximo 256 KB serializados; se comprueba ANTES de validar la forma.
          items: { $ref: '#/components/schemas/PlanElement' }

    SaveScheduleRequest:
      type: object
      additionalProperties: false
      required: [shifts]
      properties:
        timezone: { type: string, minLength: 1, maxLength: 64 }
        slotMinutes: { type: integer, enum: [5, 10, 15, 20, 30, 60] }
        cleanupMinutes: { type: integer, minimum: 0, maximum: 120 }
        durationByPartySize:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [upTo, minutes]
            properties:
              upTo: { type: integer, nullable: true, minimum: 1 }
              minutes: { type: integer, minimum: 15, maximum: 480 }
        shifts:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [weekday, opensAt, closesAt]
            properties:
              weekday: { type: integer, minimum: 0, maximum: 6 }
              opensAt: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
              closesAt: { type: string, pattern: '^([01]\\d|2[0-3]):[0-5]\\d$' }
              label: { type: string, maxLength: 40, nullable: true }

    AddScheduleExceptionRequest:
      type: object
      additionalProperties: false
      required: [onDate, kind]
      properties:
        onDate: { type: string, format: date }
        kind: { type: string, enum: [closed, special_hours] }
        opensAt: { type: string, nullable: true, description: Obligatorio cuando kind es special_hours. }
        closesAt: { type: string, nullable: true }
        reason: { type: string, maxLength: 120, nullable: true }

    ReservationStatus:
      type: string
      enum: [pending, confirmed, seated, completed, cancelled, no_show]

    ReservationSettings:
      type: object
      properties:
        id: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        enabled: { type: boolean, description: Interruptor del dueño para la página pública. }
        publicSlug: { type: string, nullable: true, description: 'Enlace público; 3 a 60 caracteres [a-z0-9-], único en todo el sistema.' }
        displayName: { type: string, nullable: true }
        publicNote: { type: string, nullable: true, maxLength: 500 }
        contactPhone: { type: string, nullable: true }
        notifyEmail: { type: string, nullable: true, description: A dónde avisar de cada reserva o cancelación en línea. }
        maxDaysAhead: { type: integer, minimum: 1, maximum: 365 }
        minNoticeMinutes: { type: integer, minimum: 0, maximum: 10080 }
        maxPartySize: { type: integer, minimum: 1, maximum: 100 }
        maxTablesPerReservation: { type: integer, minimum: 1, maximum: 10 }
        updatedAt: { type: string, format: date-time }

    ReservationSettingsInput:
      type: object
      description: Todos los campos son opcionales; solo cambian los que vengan.
      properties:
        enabled: { type: boolean }
        publicSlug: { type: string, nullable: true }
        displayName: { type: string, nullable: true, maxLength: 120 }
        publicNote: { type: string, nullable: true, maxLength: 500 }
        contactPhone: { type: string, nullable: true, maxLength: 40 }
        notifyEmail: { type: string, nullable: true, maxLength: 160 }
        maxDaysAhead: { type: integer }
        minNoticeMinutes: { type: integer }
        maxPartySize: { type: integer }
        maxTablesPerReservation: { type: integer }

    AvailabilitySlot:
      type: object
      properties:
        time: { type: string, example: '19:30', description: Hora local HH:mm. }
        startsAt: { type: string, format: date-time }
        shiftLabel: { type: string, nullable: true }
        available: { type: boolean }
        reason: { type: string, enum: [full, notice], description: Solo si no está disponible. }

    DayAvailability:
      type: object
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [open, closed, past, too_far] }
        slots:
          type: array
          items: { $ref: '#/components/schemas/AvailabilitySlot' }

    PublicRestaurant:
      type: object
      properties:
        slug: { type: string }
        name: { type: string }
        note: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        timezone: { type: string, example: America/Guayaquil }
        maxPartySize: { type: integer }
        maxDaysAhead: { type: integer }
        minNoticeMinutes: { type: integer }
        openWeekdays:
          type: array
          description: Días con servicio (0 = domingo … 6 = sábado).
          items: { type: integer }

    Reservation:
      type: object
      description: Vista del personal (lleva contacto y notas).
      properties:
        id: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        source: { type: string, enum: [online, staff] }
        guestName: { type: string }
        guestEmail: { type: string, nullable: true }
        guestPhone: { type: string }
        partySize: { type: integer }
        date: { type: string, format: date }
        time: { type: string, example: '19:30' }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Fin de la comida (sin el margen de limpieza). }
        notes: { type: string, nullable: true }
        tables:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelledBy: { type: string, enum: [guest, staff], nullable: true }
        cancelReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PublicReservation:
      type: object
      description: Vista del cliente. Sin correo, teléfono ni notas.
      properties:
        code: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        guestName: { type: string }
        partySize: { type: integer }
        date: { type: string, format: date }
        time: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        restaurant:
          type: object
          properties:
            name: { type: string }
            phone: { type: string, nullable: true }
            slug: { type: string, nullable: true }
        canCancel: { type: boolean }
        cancelledBy: { type: string, enum: [guest, staff], nullable: true }

    StaffReservationInput:
      type: object
      required: [date, time, partySize, guestName, guestPhone]
      properties:
        date: { type: string, format: date }
        time: { type: string, example: '20:00' }
        partySize: { type: integer, minimum: 1 }
        guestName: { type: string }
        guestPhone: { type: string }
        guestEmail: { type: string, nullable: true }
        notes: { type: string, nullable: true, maxLength: 500 }
        tableIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }

    PublicReservationInput:
      type: object
      required: [date, time, partySize, guestName, guestEmail, guestPhone]
      properties:
        date: { type: string, format: date }
        time: { type: string, example: '19:30' }
        partySize: { type: integer, minimum: 1 }
        guestName: { type: string }
        guestEmail: { type: string }
        guestPhone: { type: string }
        notes: { type: string, nullable: true, maxLength: 500 }
        website: { type: string, description: Campo trampa para robots; debe ir vacío o ausente. }

  responses:
    ValidationError:
      description: 'Datos inválidos (`VALIDATION_ERROR` o `INVALID_PLAN`/`INVALID_SCHEDULE`)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            code: VALIDATION_ERROR
            message: La petición no es válida.
            details:
              - { field: capacityMax, message: 'La capacidad máxima no puede ser menor que la mínima.' }
    OrgContextRequired:
      description: Falta X-Organization-Id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: ORG_CONTEXT_REQUIRED, message: Falta el contexto de organización. }
    Forbidden:
      description: Permiso insuficiente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: FORBIDDEN, message: Permiso insuficiente. }
    EstablishmentNotFound:
      description: El establecimiento no existe o no es de la organización
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: ESTABLISHMENT_NOT_FOUND, message: Establecimiento no encontrado. }
    FloorNotFound:
      description: La planta no existe o es de otra organización
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: FLOOR_NOT_FOUND, message: Planta no encontrada. }
    TableNotFound:
      description: La mesa no existe o es de otra organización
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: TABLE_NOT_FOUND, message: Mesa no encontrada. }
    ZoneNotFound:
      description: La zona no existe, es de otra organización o no es de esta planta
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: ZONE_NOT_FOUND, message: Zona no encontrada. }
