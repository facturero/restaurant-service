asyncapi: 3.0.0

info:
  title: restaurant-service — Eventos
  version: 1.0.0
  description: >
    Eventos de restaurant-service sobre RabbitMQ. Publica los cambios del mapa del
    local (plantas, plano, mesas, zonas), del horario y —desde el entregable 2— de las
    reservas (ajustes, creación, cancelación y cambios de estado). **No consume eventos**:
    no hay consumidores ni `processed_events` en uso.


    Patrón Outbox + relay. Exchange topic `crm.events`. El `outbox-relay` pone
    `eventId` en las cabeceras y `ActorContext` (actor, ip, requestId) en cada
    mensaje; todo payload lleva `organizationId` porque la bitácora lo exige.


    Enrutado del gateway: aquí los eventos NO pasan por el gateway ni por su
    `requiresPlugin`. El corte por plugin es solo HTTP; por eso el servicio siempre
    publica lo que ocurre.


    `restaurant.schedule_exception.deleted` se publica desde la ruta
    `DELETE /restaurant/schedule/exceptions/{id}`, que no trae el establecimiento en
    el path: el servicio resuelve el horario por la excepción para rellenarlo.

defaultContentType: application/json

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    bindings:
      amqp:
        vhost: /

channels:

  floorCreated:
    address: restaurant.floor.created
    description: Se creó una planta (el setup deja «Salón principal»).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      floorCreated: { $ref: '#/components/messages/FloorCreated' }

  floorUpdated:
    address: restaurant.floor.updated
    description: Se actualizó una planta (nombre, medidas, orden o estado).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      floorUpdated: { $ref: '#/components/messages/FloorUpdated' }

  floorPlanSaved:
    address: restaurant.floor_plan.saved
    description: >
      Se publicó una nueva versión del plano. Un solo evento por guardado, con el
      recuento de lo que contiene; el dibujo completo vive en la base, no en el
      mensaje.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      floorPlanSaved: { $ref: '#/components/messages/FloorPlanSaved' }

  tableUpserted:
    address: restaurant.table.upserted
    description: >
      Una mesa se creó, cambió o se desactivó. La desactivación también trae estado:
      el consumidor se entera por `status`, no por un evento de borrado (las mesas
      nunca se borran).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      tableUpserted: { $ref: '#/components/messages/TableUpserted' }

  zoneUpserted:
    address: restaurant.zone.upserted
    description: Una zona se creó, cambió o se desactivó.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      zoneUpserted: { $ref: '#/components/messages/ZoneUpserted' }

  scheduleUpdated:
    address: restaurant.schedule.updated
    description: >
      Se guardaron los ajustes y/o los turnos del horario. `shiftCount` evita tener
      que leer los turnos para saber si el horario quedó vacío. El setup publica
      este evento con `shiftCount: 0` al crear el horario por defecto.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      scheduleUpdated: { $ref: '#/components/messages/ScheduleUpdated' }

  scheduleExceptionCreated:
    address: restaurant.schedule_exception.created
    description: Se añadió un cierre o un horario especial a una fecha.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      scheduleExceptionCreated: { $ref: '#/components/messages/ScheduleExceptionCreated' }

  scheduleExceptionDeleted:
    address: restaurant.schedule_exception.deleted
    description: Se borró una excepción de horario.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      scheduleExceptionDeleted: { $ref: '#/components/messages/ScheduleExceptionDeleted' }
  reservationSettingsUpdated:
    address: restaurant.reservation_settings.updated
    description: El dueño guardó los ajustes de reservas del local (página pública, límites).
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      reservationSettingsUpdated: { $ref: '#/components/messages/ReservationSettingsUpdated' }

  reservationCreated:
    address: restaurant.reservation.created
    description: >
      Se creó una reserva (desde la página pública o anotada por el personal). `notification-service` envía la
      confirmación al cliente (`guestEmail`, si hay) y el aviso al restaurante (`staffNoticeEmail`, solo si la reserva
      es en línea). Lleva `manageUrl` con el token del enlace de cancelación: está también en el outbox y en la bitácora.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      reservationCreated: { $ref: '#/components/messages/ReservationCreated' }

  reservationCancelled:
    address: restaurant.reservation.cancelled
    description: >
      Se canceló una reserva (el cliente desde su enlace, o el personal). `staffNoticeEmail` solo viene cuando canceló el cliente.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      reservationCancelled: { $ref: '#/components/messages/ReservationCancelled' }

  reservationStatusChanged:
    address: restaurant.reservation.status_changed
    description: El personal sentó la mesa, la dio por terminada o marcó que el cliente no se presentó.
    servers: [{ $ref: '#/servers/rabbitmq' }]
    bindings:
      amqp: { is: routingKey, exchange: { name: crm.events, type: topic, durable: true, vhost: / } }
    messages:
      reservationStatusChanged: { $ref: '#/components/messages/ReservationStatusChanged' }

operations:

  publishFloorCreated:
    action: send
    channel: { $ref: '#/channels/floorCreated' }

  publishFloorUpdated:
    action: send
    channel: { $ref: '#/channels/floorUpdated' }

  publishFloorPlanSaved:
    action: send
    channel: { $ref: '#/channels/floorPlanSaved' }

  publishTableUpserted:
    action: send
    channel: { $ref: '#/channels/tableUpserted' }

  publishZoneUpserted:
    action: send
    channel: { $ref: '#/channels/zoneUpserted' }

  publishScheduleUpdated:
    action: send
    channel: { $ref: '#/channels/scheduleUpdated' }

  publishScheduleExceptionCreated:
    action: send
    channel: { $ref: '#/channels/scheduleExceptionCreated' }

  publishScheduleExceptionDeleted:
    action: send
    channel: { $ref: '#/channels/scheduleExceptionDeleted' }
  publishReservationSettingsUpdated:
    action: send
    channel: { $ref: '#/channels/reservationSettingsUpdated' }

  publishReservationCreated:
    action: send
    channel: { $ref: '#/channels/reservationCreated' }

  publishReservationCancelled:
    action: send
    channel: { $ref: '#/channels/reservationCancelled' }

  publishReservationStatusChanged:
    action: send
    channel: { $ref: '#/channels/reservationStatusChanged' }

components:

  messageTraits:
    eventEnvelope:
      headers:
        type: object
        required: [eventId, type, occurredAt]
        properties:
          eventId: { type: string, format: uuid }
          type: { type: string }
          occurredAt: { type: string, format: date-time }
          organizationId: { type: string, format: uuid, nullable: true }

  messages:

    FloorCreated:
      name: restaurant.floor.created
      title: Planta creada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/FloorPayload' }

    FloorUpdated:
      name: restaurant.floor.updated
      title: Planta actualizada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/FloorUpdatedPayload' }

    FloorPlanSaved:
      name: restaurant.floor_plan.saved
      title: Plano guardado
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/FloorPlanSavedPayload' }

    TableUpserted:
      name: restaurant.table.upserted
      title: Mesa creada, actualizada o desactivada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/TablePayload' }

    ZoneUpserted:
      name: restaurant.zone.upserted
      title: Zona creada, actualizada o desactivada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ZonePayload' }

    ScheduleUpdated:
      name: restaurant.schedule.updated
      title: Horario actualizado
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/SchedulePayload' }

    ScheduleExceptionCreated:
      name: restaurant.schedule_exception.created
      title: Excepción de horario creada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ScheduleExceptionPayload' }

    ScheduleExceptionDeleted:
      name: restaurant.schedule_exception.deleted
      title: Excepción de horario borrada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ScheduleExceptionPayload' }

    ReservationSettingsUpdated:
      name: restaurant.reservation_settings.updated
      title: Ajustes de reservas guardados
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ReservationSettingsPayload' }

    ReservationCreated:
      name: restaurant.reservation.created
      title: Reserva creada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ReservationNoticePayload' }

    ReservationCancelled:
      name: restaurant.reservation.cancelled
      title: Reserva cancelada
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload:
        allOf:
          - $ref: '#/components/schemas/ReservationNoticePayload'
          - type: object
            properties:
              cancelledBy: { type: string, enum: [guest, staff] }
              cancelReason: { type: string, description: Cadena vacía si no hay motivo. }

    ReservationStatusChanged:
      name: restaurant.reservation.status_changed
      title: Estado de la reserva cambiado
      contentType: application/json
      traits: [{ $ref: '#/components/messageTraits/eventEnvelope' }]
      payload: { $ref: '#/components/schemas/ReservationStatusChangedPayload' }

  schemas:

    FloorPayload:
      type: object
      required: [floorId, establishmentId, name, status, organizationId]
      properties:
        floorId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, inactive] }
        organizationId: { type: string, format: uuid }

    FloorUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/FloorPayload'
        - type: object
          required: [previous]
          properties:
            previous:
              type: object
              description: Estado anterior, para que la bitácora muestre el cambio.
              properties:
                name: { type: string }
                status: { type: string, enum: [active, inactive] }

    FloorPlanSavedPayload:
      type: object
      required: [floorId, establishmentId, version, tableCount, wallCount, elementCount, organizationId]
      properties:
        floorId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        version: { type: integer, description: Nueva `layoutVersion` de la planta. }
        tableCount: { type: integer, description: Mesas que quedaron activas en el plano. }
        wallCount: { type: integer }
        elementCount: { type: integer }
        organizationId: { type: string, format: uuid }

    TablePayload:
      type: object
      required: [tableId, floorId, establishmentId, name, capacityMin, capacityMax, status, organizationId]
      properties:
        tableId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        name: { type: string }
        capacityMin: { type: integer }
        capacityMax: { type: integer }
        zoneId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [active, inactive] }
        organizationId: { type: string, format: uuid }

    ZonePayload:
      type: object
      required: [zoneId, floorId, name, color, status, organizationId]
      properties:
        zoneId: { type: string, format: uuid }
        floorId: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, enum: [primary, secondary, success, info, warning, error] }
        status: { type: string, enum: [active, inactive] }
        organizationId: { type: string, format: uuid }

    SchedulePayload:
      type: object
      required: [establishmentId, timezone, slotMinutes, shiftCount, organizationId]
      properties:
        establishmentId: { type: string, format: uuid }
        timezone: { type: string }
        slotMinutes: { type: integer }
        shiftCount: { type: integer, description: Turnos que quedaron tras el guardado. }
        organizationId: { type: string, format: uuid }

    ScheduleExceptionPayload:
      type: object
      required: [establishmentId, exceptionId, onDate, kind, organizationId]
      properties:
        establishmentId: { type: string, format: uuid }
        exceptionId: { type: string, format: uuid }
        onDate: { type: string, format: date }
        kind: { type: string, enum: [closed, special_hours] }
        organizationId: { type: string, format: uuid }

    ReservationSettingsPayload:
      type: object
      required: [establishmentId, enabled, maxDaysAhead, minNoticeMinutes, maxPartySize, maxTablesPerReservation, organizationId]
      properties:
        establishmentId: { type: string, format: uuid }
        enabled: { type: boolean }
        publicSlug: { type: string, nullable: true }
        maxDaysAhead: { type: integer }
        minNoticeMinutes: { type: integer }
        maxPartySize: { type: integer }
        maxTablesPerReservation: { type: integer }
        organizationId: { type: string, format: uuid }

    ReservationNoticePayload:
      type: object
      description: >
        Todo lo que necesitan los correos, ya listo para la plantilla. Las cadenas vacías significan «no hay»
        (la plantilla de correo trata un destinatario vacío como «no enviar»); por eso no se usa `null`.
      required: [reservationId, establishmentId, code, status, source, guestName, guestPhone, partySize, onDate, startsAt, timeText, dateText, restaurantName, organizationId]
      properties:
        reservationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        code: { type: string, description: 'Código corto que el cliente puede dictar por teléfono (8 caracteres sin 0/O/1/I/L).' }
        status: { type: string, enum: [pending, confirmed, seated, completed, cancelled, no_show] }
        source: { type: string, enum: [online, staff] }
        guestName: { type: string }
        guestEmail: { type: string, description: Vacío si la reserva se anotó por teléfono sin correo. }
        guestPhone: { type: string }
        partySize: { type: integer }
        notes: { type: string }
        onDate: { type: string, format: date, description: Fecha local del restaurante. }
        startsAt: { type: string, format: date-time, description: UTC. }
        timeText: { type: string, description: Hora local, HH:mm. }
        dateText: { type: string, description: 'Fecha local legible en español, p. ej. «sábado, 17 de octubre de 2026».' }
        restaurantName: { type: string }
        restaurantPhone: { type: string }
        staffNoticeEmail: { type: string, description: A dónde avisar al restaurante; vacío si no corresponde (lo hizo su propio personal). }
        tableNames: { type: string, description: 'Mesas separadas por coma.' }
        manageUrl: { type: string, description: Enlace para ver o cancelar sin sesión; solo en `created`. }
        organizationId: { type: string, format: uuid }

    ReservationStatusChangedPayload:
      type: object
      required: [reservationId, establishmentId, code, previous, status, organizationId]
      properties:
        reservationId: { type: string, format: uuid }
        establishmentId: { type: string, format: uuid }
        code: { type: string }
        previous: { type: string, enum: [pending, confirmed, seated, completed, cancelled, no_show] }
        status: { type: string, enum: [pending, confirmed, seated, completed, cancelled, no_show] }
        organizationId: { type: string, format: uuid }
